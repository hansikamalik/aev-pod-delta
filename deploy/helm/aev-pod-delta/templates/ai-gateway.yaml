{{- if .Values.aiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ai-gateway
    {{- include "aev-pod-delta.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.aiGateway.replicas }}
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
    spec:
      containers:
        - name: ai-gateway
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.aiGateway.image }}:{{ .Values.aiGateway.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: aev-config
            - secretRef:
                name: aev-secrets
          resources:
            {{- toYaml .Values.aiGateway.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway-svc
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ai-gateway
    {{- include "aev-pod-delta.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: ai-gateway
{{- if .Values.aiGateway.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-gateway-hpa
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ai-gateway
    {{- include "aev-pod-delta.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-gateway
  minReplicas: {{ .Values.aiGateway.hpa.minReplicas }}
  maxReplicas: {{ .Values.aiGateway.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.aiGateway.hpa.cpuThreshold }}
{{- end }}
{{- end }}
