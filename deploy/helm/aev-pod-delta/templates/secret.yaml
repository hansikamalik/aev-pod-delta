apiVersion: v1
kind: Secret
metadata:
  name: aev-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aev-pod-delta.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  SLACK_ALERT_WEBHOOK_URL: {{ .Values.secrets.slackAlertWebhookUrl | quote }}
  PAGERDUTY_ALERT_WEBHOOK_URL: {{ .Values.secrets.pagerdutyAlertWebhookUrl | quote }}
