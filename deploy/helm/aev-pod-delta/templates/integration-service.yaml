{{- if .Values.integrationService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: integration-service
    {{- include "aev-pod-delta.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.integrationService.replicas }}
  selector:
    matchLabels:
      app: integration-service
  template:
    metadata:
      labels:
        app: integration-service
    spec:
      containers:
        - name: integration-service
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.integrationService.image }}:{{ .Values.integrationService.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: aev-config
            - secretRef:
                name: aev-secrets
          resources:
            {{- toYaml .Values.integrationService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: integration-svc
  namespace: {{ .Values.global.namespace }}
  labels:
    app: integration-service
    {{- include "aev-pod-delta.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: integration-service
{{- end }}
