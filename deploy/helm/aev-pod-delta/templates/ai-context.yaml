{{- if .Values.aiContext.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-context
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ai-context
    {{- include "aev-pod-delta.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.aiContext.replicas }}
  selector:
    matchLabels:
      app: ai-context
  template:
    metadata:
      labels:
        app: ai-context
    spec:
      containers:
        - name: ai-context
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.aiContext.image }}:{{ .Values.aiContext.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: aev-config
            - secretRef:
                name: aev-secrets
          resources:
            {{- toYaml .Values.aiContext.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ai-context-svc
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ai-context
    {{- include "aev-pod-delta.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
  selector:
    app: ai-context
{{- if .Values.aiContext.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-context-hpa
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ai-context
    {{- include "aev-pod-delta.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-context
  minReplicas: {{ .Values.aiContext.hpa.minReplicas }}
  maxReplicas: {{ .Values.aiContext.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.aiContext.hpa.cpuThreshold }}
{{- end }}
{{- end }}
