apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aev-ingress
  namespace: aev-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
spec:
  rules:
    - host: aev.internal
      http:
        paths:
          - path: /api/v1/copilot
            pathType: Prefix
            backend:
              service:
                name: ai-gateway-svc
                port:
                  number: 80
          - path: /api/v1/context
            pathType: Prefix
            backend:
              service:
                name: ai-context-svc
                port:
                  number: 8001
          - path: /api/v1/integrations
            pathType: Prefix
            backend:
              service:
                name: integration-svc
                port:
                  number: 80
