apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-context
  namespace: aev-system
  labels:
    app: ai-context
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-context
  template:
    metadata:
      labels:
        app: ai-context
    spec:
      containers:
        - name: ai-context
          image: ghcr.io/aev-pod-delta/ai-context:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: aev-config
            - secretRef:
                name: aev-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ai-context-svc
  namespace: aev-system
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
  selector:
    app: ai-context
