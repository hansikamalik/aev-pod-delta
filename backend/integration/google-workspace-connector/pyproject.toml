[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-workspace-connector"
version = "0.1.0"
description = "AEV Platform Google Workspace integration connector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-workspace-auth>=1.0.0",
  "google-api-python-client>=2.140.0",
  "google-auth>=2.30.0",
  "pydantic>=2.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
