services:
  integration-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DATABASE_URL=postgresql://integration_user:integration_pass@postgres:5432/integration
    depends_on:
      - postgres
    volumes:
      - .:/code   # mounts local code into the container so --reload-style workflows still work

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=integration_user
      - POSTGRES_PASSWORD=integration_pass
      - POSTGRES_DB=integration
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
