[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qradar_connector"
version = "0.1.0"
dependencies = [
    "requests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qradar_connector*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
