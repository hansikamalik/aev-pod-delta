[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aev-google-workspace-auth"
version = "0.1.0"
description = "Google Workspace OAuth authentication module for the AEV Integration Hub"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "PyJWT>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["google_workspace_auth"]

[tool.coverage.report]
show_missing = true
fail_under = 70
