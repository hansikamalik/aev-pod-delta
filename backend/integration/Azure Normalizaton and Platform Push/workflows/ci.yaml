name: Azure Normalization & Asset Push Module CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'azure_normalization_push/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'azure_normalization_push/**'
      - '.github/workflows/ci.yml'

jobs:
  validate-and-test:
    name: Run Linter, Schema Validation & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./azure_normalization_push

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      # Step 1: Check out repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python Environment
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov jsonschema requests requests-mock

      # Step 4: Code Quality & Linting Check
      - name: Lint Code with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max line length set to 120
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      # Step 5: Validate JSON Schema Contract
      - name: Validate CAM JSON Schema File
        run: |
          python -c "import json, jsonschema; schema = json.load(open('contracts/azure_cam_schema.json')); jsonschema.Draft7Validator.check_schema(schema); print('Schema contract syntax is valid Draft-07!')"

      # Step 6: Execute Unit Tests with Code Coverage
      - name: Run Pytest Test Suite
        run: |
          pytest tests/ \
            --doctest-modules \
            --junitxml=junit/test-results-${{ matrix.python-version }}.xml \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=85

      # Step 7: Upload Coverage Report Artifact
      - name: Upload Test Coverage Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-coverage-python-${{ matrix.python-version }}
          path: azure_normalization_push/coverage.xml
          retention-days: 7
