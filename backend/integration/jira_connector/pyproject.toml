[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-connector"
version = "0.1.0"
description = "Jira connector: creates tickets from platform exposures and syncs ticket status back to the platform. Implements the shared connector_sdk.Connector contract."
requires-python = ">=3.11"
dependencies = [
    "connector-sdk",
    "pydantic>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["jira_connector*"]
