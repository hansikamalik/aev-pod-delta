[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-workspace-auth-connector"
version = "0.1.0"
description = "Secure Google Workspace OAuth connector for cybersecurity integrations"
requires-python = ">=3.11"
dependencies = ["cryptography>=42.0"]

[tool.setuptools.packages.find]
where = ["src"]
