[pytest]
testpaths = tests
addopts = -ra --strict-markers --timeout=60
markers =
    contract: connector contract tests (P0)
    azure: Azure module tests
    splunk: Splunk connector tests
    infra: shared infrastructure tests
    integration: end-to-end suite
    regression: post-integration regression

[coverage:run]
source = qa,azure_connector,splunk_connector,infra
omit =
    */tests/*
    qa/mocks/*

[coverage:report]
show_missing = True
