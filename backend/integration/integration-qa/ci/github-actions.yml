name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt -r requirements.txt
      - name: Contract tests (P0 gate)
        run: pytest tests/contract -m contract -v
      - name: Full suite + coverage
        run: pytest --cov --cov-report=xml -q -m "not regression"
      - name: Regression
        run: pytest tests/regression -m regression -q
