[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-connector"
version = "0.1.0"
description = "Microsoft Sentinel connector for the AEV Platform (Pod Delta M4)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
