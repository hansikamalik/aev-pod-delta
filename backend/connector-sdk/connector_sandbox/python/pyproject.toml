[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-sandbox"
version = "0.3.0"
description = "Integration testing sandbox for Connector SDK connectors"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sandbox = "sandbox.runner:main"

[tool.setuptools.packages.find]
include = ["sandbox*", "mock_server*", "connectors*", "connector_sdk*", "scenarios*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
