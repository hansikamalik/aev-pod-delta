version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: aev_postgres
    environment:
      POSTGRES_DB: aevdb
      POSTGRES_USER: aev
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: aev_redis
    ports:
      - "6379:6379"

  ai-gateway:
    build: .
    container_name: aev_ai_gateway
    ports:
      - "8000:8000"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://aev:secret@postgres:5432/aevdb
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

volumes:
  postgres_data:
