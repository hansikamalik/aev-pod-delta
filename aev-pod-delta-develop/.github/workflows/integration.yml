[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberark_auth_module"
version = "1.0.0"
description = "A comprehensive Python authentication library for CyberArk PAM, CCP, and Identity Cloud."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "requests-mock>=1.10.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
