[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "connector-sdk"
version = "0.1.0"
description = "Common contract and base classes for platform integration connectors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Integration Squad" }]
keywords = ["connector", "integration", "sdk", "azure", "splunk"]
# Deliberately zero runtime dependencies: the SDK must install cleanly in
# every workstream's environment without version conflicts.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-asyncio>=0.23", "pytest-cov>=4.1"]
dev = [
  "connector-sdk[test]",
  "ruff>=0.4",
  "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["connector_sdk"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018", "SIM117"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
