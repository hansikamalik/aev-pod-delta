# AEV Pod Delta — NGINX Ingress Configuration
# Managed by docker-compose.prod.yml (mounted read-only)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ---------------------------------------------------------------------------
    # Gzip compression
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_types text/plain application/json;
    gzip_min_length 256;

    # ---------------------------------------------------------------------------
    # Upstream definitions
    # ---------------------------------------------------------------------------
    upstream ai_gateway {
        server ai-gateway:8000;
    }

    upstream ai_context {
        server ai-context:8001;
    }

    upstream integration_service {
        server integration-service:8000;
    }

    # ---------------------------------------------------------------------------
    # Shared proxy header snippet (referenced in each location block)
    # ---------------------------------------------------------------------------
    # proxy_set_header directives are repeated per location because NGINX does
    # not support reusable header snippets without the include directive.

    # ---------------------------------------------------------------------------
    # HTTP server (port 80)
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;

        # -- AI Gateway --------------------------------------------------------
        location /api/v1/copilot {
            proxy_pass http://ai_gateway;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -- AI Context --------------------------------------------------------
        location /api/v1/context {
            proxy_pass http://ai_context;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -- Integration Service -----------------------------------------------
        location /api/v1/integrations {
            proxy_pass http://integration_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -- Health endpoint ---------------------------------------------------
        location /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ---------------------------------------------------------------------------
    # TLS — HTTPS server (port 443)
    # To enable:
    #   1. Uncomment the server block below.
    #   2. Uncomment "- 443:443" in docker-compose.prod.yml ports section.
    #   3. Mount your certificates into the container, e.g.:
    #        - ./certs/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
    #        - ./certs/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    # ---------------------------------------------------------------------------
