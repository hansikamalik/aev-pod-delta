name: Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests-mock

      - name: Install integration dependencies
        if: hashFiles('backend/integration/requirements.txt') != ''
        run: |
          python -m pip install -r backend/integration/requirements.txt

      - name: Run integration tests
        run: |
          python -m pytest -v backend/integration

      - name: Run Azure normalization and platform push tests
        shell: bash
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/backend/integration/Azure Normalization and Platform Push"
          python -m pytest -v \
            "backend/integration/Azure Normalization and Platform Push/tests"

      - name: Run CyberArk authentication tests
        shell: bash
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/backend/integration/cyberark_auth_module"
          python -m pytest -v \
            backend/integration/cyberark_auth_module/tests
