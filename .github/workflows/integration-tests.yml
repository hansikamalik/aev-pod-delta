name: Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests-mock

      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/integration/requirements.txt

      - name: Run integration tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration
        run: |
          python -m pytest -v \
            --import-mode=importlib \
            backend/integration

      - name: Run Azure Normalizaton and platform push tests
        shell: bash
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/backend/integration/Azure Normalizaton and Platform Push"
          python -m pytest -v \
            "backend/integration/Azure Normalizaton and Platform Push/tests"

      - name: Run CyberArk authentication tests
        shell: bash
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/backend/integration/cyberark_auth_module"
          python -m pytest -v \
            backend/integration/cyberark_auth_module/tests

      - name: Run Azure integration tests
        working-directory: backend/integration/Azure Normalizaton and Platform Push
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/Azure Normalizaton and Platform Push
        run: |
          python -m pytest -v tests

      - name: Run CyberArk integration tests
        working-directory: backend/integration/cyberark-discovery-integration
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/cyberark-discovery-integration
        run: |
          python -m pytest -v tests

      - name: Run integration QA tests
        working-directory: backend/integration/integration-qa
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/integration-qa
        run: |
          python -m pytest -v --import-mode=importlib tests

      - name: Run Vault tests
        working-directory: backend/integration/vault-enterprise-framework
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/vault-enterprise-framework
        run: |
          python -m pytest -v scripts/test_migrate.py
          
