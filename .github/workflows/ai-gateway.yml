name: AI Gateway CI

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/ai-gateway/**'
      - '.github/workflows/ai-gateway.yml'

  pull_request:
    branches:
      - develop
    paths:
      - 'backend/ai-gateway/**'
      - '.github/workflows/ai-gateway.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/ai-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: flake8 app --max-line-length=100

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -v