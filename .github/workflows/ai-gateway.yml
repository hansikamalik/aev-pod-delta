name: AI Gateway CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/ai-gateway/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/ai-gateway/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai-gateway
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: flake8 app --max-line-length=100

      - name: Run tests
        run: pytest