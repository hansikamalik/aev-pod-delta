name: AI Context CI

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/ai-context/**'
      - '.github/workflows/ai-context.yml'

  pull_request:
    branches:
      - develop
    paths:
      - 'backend/ai-context/**'
      - '.github/workflows/ai-context.yml'

jobs:
  test:
    name: Run AI Context Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai-context/CODES/AEV_AI_CONTEXT_Handover

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install lightweight CI deps (torch/sentence-transformers excluded — tests use
          # the deterministic fallback embedding defined in app/embedding.py)
          pip install fastapi uvicorn pydantic python-dotenv httpx pytest pytest-asyncio \
              sqlalchemy psycopg2-binary pgvector greenlet typing_extensions psycopg[binary]

      - name: Run tests
        run: PYTHONPATH=. python -m pytest app/tests/ -v -o pythonpath=.
