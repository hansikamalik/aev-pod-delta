[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberark_auth_module"
version = "1.0.0"
description = "A comprehensive Python authentication library for CyberArk PAM, CCP, and Identity Cloud."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "requests-mock>=1.10.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

      - name: Install integration dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/integration/requirements.txt

          # Install dependencies required by individual suites.
          # Keep these in the respective requirements files if possible.
          python -m pip install pydantic hvac

      - name: Run connector tests
        shell: bash
        run: |
          set -euo pipefail

          run_suite() {
            local dir="$1"
            shift

            echo "Running $dir"
            (
              cd "$dir"
              export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
              python -m pytest --import-mode=importlib -v "$@"
            )
          }

          run_suite \
            "backend/integration/connector-github/connector-github" \
            tests

          run_suite \
            "backend/integration/connector-gitlab" \
            tests

          run_suite \
            "backend/integration/connector-microsoft-sentinel" \
            tests

          run_suite \
            "backend/integration/connector-sentinelone" \
            tests

          run_suite \
            "backend/integration/google-workspace-connector" \
            tests

          run_suite \
            "backend/integration/microsoft365-connector" \
            tests

          run_suite \
            "backend/integration/servicenow-connector" \
            tests

          run_suite \
            "backend/integration/okta_connector" \
            tests

          run_suite \
            "backend/integration/qradar_connector" \
            tests


[tool.setuptools.packages.find]
where = ["."]
