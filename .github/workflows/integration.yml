name: Integration CI

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/integration/**'
      - '.github/workflows/integration.yml'

  pull_request:
    branches:
      - develop
    paths:
      - 'backend/integration/**'
      - '.github/workflows/integration.yml'

jobs:
  test-integration:
    name: Run integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Install integration dependencies
        if: hashFiles('backend/integration/requirements.txt') != ''
        run: |
          pip install -r backend/integration/requirements.txt

      - name: Run integration tests
        shell: bash
        run: |
          if [ -d backend/integration/tests ]; then
            PYTHONPATH=backend/integration python -m pytest -v backend/integration/tests
          elif [ -d backend/integration/auth/tests ] || [ -d backend/integration/discovery/tests ]; then
            PYTHONPATH=backend/integration python -m pytest -v backend/integration
          else
            echo "No integration tests found - skipping tests."


