[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberark_auth_module"
version = "1.0.0"
description = "A comprehensive Python authentication library for CyberArk PAM, CCP, and Identity Cloud."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "requests-mock>=1.10.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

      - name: Install integration dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/integration/requirements.txt

          # Install dependencies required by individual suites.
          # Keep these in the respective requirements files if possible.
          python -m pip install pydantic hvac

      - name: Run connector tests
        shell: bash
        run: |
          set -euo pipefail

          run_suite() {
            local dir="$1"
            shift

            echo "Running $dir"
            (
              cd "$dir"
              export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
              python -m pytest --import-mode=importlib -v "$@"
            )
          }

          run_suite \
            "backend/integration/connector-github/connector-github" \
            tests

          run_suite \
            "backend/integration/connector-gitlab" \
            tests

          run_suite \
            "backend/integration/connector-microsoft-sentinel" \
            tests

          run_suite \
            "backend/integration/connector-sentinelone" \
            tests

          run_suite \
            "backend/integration/google-workspace-connector" \
            tests

          run_suite \
            "backend/integration/microsoft365-connector" \
            tests

          run_suite \
            "backend/integration/servicenow-connector" \
            tests

          run_suite \
            "backend/integration/okta_connector" \
            tests

          run_suite \
            "backend/integration/qradar_connector" \
            tests
name: Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests-mock

      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/integration/requirements.txt

      - name: Run integration tests
        run: |
          python -m pytest -v backend/integration

      - name: Run Azure Normalizaton and platform push tests
        shell: bash
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/backend/integration/Azure Normalizaton and Platform Push"
          python -m pytest -v \
            "backend/integration/Azure Normalizaton and Platform Push/tests"

      - name: Run CyberArk authentication tests
        shell: bash
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/backend/integration/cyberark_auth_module"
          python -m pytest -v \
            backend/integration/cyberark_auth_module/tests

      - name: Run Azure integration tests
        working-directory: backend/integration/Azure Normalizaton and Platform Push
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/Azure Normalizaton and Platform Push
        run: |
          python -m pytest -v tests

      - name: Run CyberArk integration tests
        working-directory: backend/integration/cyberark-discovery-integration
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/cyberark-discovery-integration
        run: |
          python -m pytest -v tests

      - name: Run integration QA tests
        working-directory: backend/integration/integration-qa
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/integration-qa
        run: |
          python -m pytest -v --import-mode=importlib tests

      - name: Run Vault tests
        working-directory: backend/integration/vault-enterprise-framework
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/vault-enterprise-framework
        run: |
          python -m pytest -v scripts/test_migrate.py
          

[tool.setuptools.packages.find]
where = ["."]

