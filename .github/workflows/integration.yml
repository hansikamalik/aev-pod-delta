name: Integration CI

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/integration/**'
      - '.github/workflows/integration.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'backend/integration/**'
      - '.github/workflows/integration.yml'

jobs:
  test-integration:
    name: Run integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests-mock
          pip install -r backend/integration/requirements.txt

      - name: Install integration dependencies
        if: hashFiles('backend/integration/requirements.txt') != ''
        run: |
          pip install -r backend/integration/requirements.txt
          
      - name: Run integration tests
        shell: bash
        run: |
          AZURE_DIR="backend/integration/Azure Normalizaton and Platform Push"
          CYBERARK_DIR="backend/integration/cyberark_auth_module"

          echo "Running Azure normalization tests"
          PYTHONPATH="$GITHUB_WORKSPACE/$AZURE_DIR" \
            python -m pytest -v "$AZURE_DIR/tests"

          echo "Running CyberArk authentication tests"
          PYTHONPATH="$GITHUB_WORKSPACE/$CYBERARK_DIR" \
            python -m pytest -v "$CYBERARK_DIR/tests"
