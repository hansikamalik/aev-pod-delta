name: Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests-mock
          python -m pip install -r backend/integration/requirements.txt
          python -m pip install pydantic hvac

      - name: Run integration tests
        run: python -m pytest -v backend/integration

      - name: Run connector tests
        shell: bash
        run: |
          set -euo pipefail

          run_suite() {
            local dir="$1"
            shift
            echo "Running $dir"
            (
              cd "$dir"
              export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
              python -m pytest --import-mode=importlib -v "$@"
            )
          }

          run_suite "backend/integration/connector-github/connector-github" tests
          run_suite "backend/integration/connector-gitlab" tests
          run_suite "backend/integration/connector-microsoft-sentinel" tests
          run_suite "backend/integration/connector-sentinelone" tests
          run_suite "backend/integration/google-workspace-connector" tests
          run_suite "backend/integration/microsoft365-connector" tests
          run_suite "backend/integration/servicenow-connector" tests
          run_suite "backend/integration/okta_connector" tests
          run_suite "backend/integration/qradar_connector" tests

      - name: Run Azure integration tests
        working-directory: backend/integration/Azure Normalizaton and Platform Push
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/Azure Normalizaton and Platform Push
        run: python -m pytest -v tests

      - name: Run CyberArk authentication tests
        working-directory: backend/integration/cyberark_auth_module
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/cyberark_auth_module
        run: python -m pytest -v tests

      - name: Run CyberArk integration tests
        working-directory: backend/integration/cyberark-discovery-integration
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/cyberark-discovery-integration
        run: python -m pytest -v tests

      - name: Run integration QA tests
        working-directory: backend/integration/integration-qa
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/integration-qa
        run: python -m pytest -v --import-mode=importlib tests

      - name: Run Vault tests
        working-directory: backend/integration/vault-enterprise-framework
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/vault-enterprise-framework
        run: python -m pytest -v scripts/test_migrate.py
