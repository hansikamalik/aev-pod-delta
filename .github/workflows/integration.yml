name: Integration CI

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/integration/**'
      - '.github/workflows/integration.yml'

  pull_request:
    branches:
      - develop
    paths:
      - 'backend/integration/**'
      - '.github/workflows/integration.yml'

jobs:
  test-integration:
    name: Run integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests requests-mock jsonschema

      - name: Run Azure normalization tests
        working-directory: backend/integration/Azure Normalizaton and Platform Push
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v tests

      - name: Run CyberArk tests
        working-directory: backend/integration/cyberark_auth_module
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v tests





      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests-mock

      - name: Install integration dependencies
        run: |
          if [ -f backend/integration/requirements.txt ]; then
            python -m pip install -r backend/integration/requirements.txt
          fi

          if [ -f "backend/integration/Azure Normalizaton and Platform Push/requirements.txt" ]; then
            python -m pip install -r "backend/integration/Azure Normalizaton and Platform Push/requirements.txt"
          fi

          if [ -f backend/integration/cyberark_auth_module/requirements.txt ]; then
            python -m pip install -r backend/integration/cyberark_auth_module/requirements.txt
          fi

      - name: Run integration tests
        shell: bash
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/backend/integration/Azure Normalizaton and Platform Push:$GITHUB_WORKSPACE/backend/integration/cyberark_auth_module:$PYTHONPATH"

          python -m pytest -v \
            "backend/integration/Azure Normalizaton and Platform Push/tests" \
            "backend/integration/cyberark_auth_module/tests"

      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/integration/requirements.txt

      - name: Run integration tests
        working-directory: backend/integration
        run: |
          python -m pytest -c pytest.ini -v
