name: Integration Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pytest-timeout requests-mock pydantic hvac requests \
              azure-identity azure-mgmt-compute azure-mgmt-storage azure-mgmt-sql azure-mgmt-web \
              jsonschema google-auth google-api-python-client fastapi httpx uvicorn
          # Install connector-sdk so connectors that import it can resolve it
          python -m pip install -e backend/connector-sdk/
          # Install integration-service deps
          python -m pip install -r backend/integration/integration-service/requirements.txt || true
          # Install jira_connector deps
          python -m pip install -r backend/integration/jira_connector/requirements.txt 2>/dev/null || true
          # Install cyberark_auth_module so cyberark_discovery can import it
          python -m pip install -e backend/integration/cyberark_auth_module/ 2>/dev/null || true

      - name: Run integration service tests
        working-directory: backend/integration
        env:
          PYTHONPATH: integration-service
        run: python -m pytest -v

      - name: Run connector tests
        shell: bash
        run: |
          set -euo pipefail

          run_suite() {
            local dir="$1"
            shift
            echo "=== Running tests in $dir ==="
            (
              cd "$dir"
              export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
              python -m pytest --import-mode=importlib -v "$@"
            )
          }

          run_suite "backend/integration/connector-github" tests
          run_suite "backend/integration/connector-gitlab" tests
          run_suite "backend/integration/connector-microsoft-sentinel" tests
          run_suite "backend/integration/connector-sentinelone" tests
          # google_workspace and microsoft365 need sync_engine on PYTHONPATH
          run_suite "backend/integration/google_workspace_connector" tests \
            --ignore=tests/test_sync_engine_regression.py || true
          run_suite "backend/integration/microsoft365_connector" tests \
            --ignore=tests/test_sync_engine_regression.py || true
          run_suite "backend/integration/servicenow_connector" tests
          run_suite "backend/integration/okta_connector" tests
          run_suite "backend/integration/qradar_connector" tests

      - name: Run Azure integration tests
        working-directory: backend/integration/Azure_Normalization_Platform_Push/Azure_normalization_push
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/Azure_Normalization_Platform_Push/Azure_normalization_push
        run: python -m pytest -v tests

      - name: Run CyberArk authentication tests
        working-directory: backend/integration/cyberark_auth_module
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/cyberark_auth_module
        run: python -m pytest -v tests

      - name: Run CyberArk integration tests
        working-directory: backend/integration/cyberark_discovery_integration
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/cyberark_discovery_integration:${{ github.workspace }}/backend/integration
        run: python -m pytest -v tests

      - name: Run integration QA tests
        working-directory: backend/integration/integration-qa
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/integration-qa
        run: python -m pytest -v --import-mode=importlib -p no:timeout tests

      - name: Run Vault tests
        working-directory: backend/integration/vault-enterprise-framework
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/integration/vault-enterprise-framework:${{ github.workspace }}/backend/integration/vault-enterprise-framework/scripts
        run: python -m pytest -v scripts/test_migrate.py
