name: Connector SDK CI

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/connector-sdk/**'
      - '.github/workflows/connector-sdk.yml'

  pull_request:
    branches:
      - develop
    paths:
      - 'backend/connector-sdk/**'
      - '.github/workflows/connector-sdk.yml'

jobs:
  test:
    name: Run Connector SDK tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Install Connector SDK dependencies
        if: hashFiles('backend/connector-sdk/requirements.txt') != ''
        run: |
          pip install -r backend/connector-sdk/requirements.txt

      - name: Run tests
        shell: bash
        run: |
          if [ -d backend/connector-sdk/tests ]; then
            python -m pytest -v backend/connector-sdk/tests
          else
            echo "No Connector SDK tests found - skipping tests."
          fi