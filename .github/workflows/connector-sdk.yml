name: Connector SDK CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/connector-sdk/requirements.txt ]; then
            pip install -r backend/connector-sdk/requirements.txt
          fi

      - name: Run tests
        run: |
          if [ -d backend/connector-sdk/tests ]; then
            pytest backend/connector-sdk/tests
          else
            echo "No Connector SDK tests found"
          fi