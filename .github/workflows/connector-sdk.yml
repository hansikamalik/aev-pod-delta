name: Connector SDK CI

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/connector-sdk/**'
      - '.github/workflows/connector-sdk.yml'

  pull_request:
    branches:
      - develop
    paths:
      - 'backend/connector-sdk/**'
      - '.github/workflows/connector-sdk.yml'

jobs:
  test:
    name: Run Connector SDK tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/connector-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic>=2.0 pytest pytest-asyncio
          pip install -e .

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -v tests/
